<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Search List</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }
    .container {
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 3px 15px rgba(0,0,0,.08);
    }
    h1 { margin-top: 0; }
    p { color: #666; }
    textarea {
      width: 100%;
      min-height: 220px;
      resize: vertical;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      line-height: 1.5;
    }
    .controls {
      display: flex;
      gap: 10px;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    button {
      border: 0;
      border-radius: 8px;
      padding: 11px 16px;
      cursor: pointer;
      font-size: 14px;
    }
    #generateBtn {
      background: #e62117;
      color: white;
    }
    #clearBtn {
      background: #eee;
    }
    .results {
      margin-top: 24px;
      display: grid;
      gap: 10px;
    }
    .search-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #fafafa;
    }
    .search-text {
      flex: 1;
      word-break: break-word;
    }
    .search-button {
      background: #e62117;
      color: white;
      white-space: nowrap;
    }
    .count {
      margin-top: 15px;
      color: #666;
      font-size: 14px;
    }
    @media (max-width: 600px) {
      .search-row {
        align-items: stretch;
        flex-direction: column;
      }
      .search-button { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>YouTube Search List</h1>
      <p>
        Enter one search query per line. The app will create a button for each
        query and open YouTube search filtered to <strong>Channels</strong>.
      </p>

      <textarea id="searchInput" placeholder="python tutorial
javascript tutorial
react tutorial
web development"></textarea>

      <div class="controls">
        <button id="generateBtn">Generate Search Buttons</button>
        <button id="clearBtn">Clear</button>
      </div>

      <div id="count" class="count"></div>
      <div id="results" class="results"></div>
    </div>
  </div>

  <script>
    const input = document.getElementById("searchInput");
    const results = document.getElementById("results");
    const count = document.getElementById("count");

    function createYouTubeChannelSearch(query) {
      // YouTube's search filter parameter for Channels is sp=EgIQAg%3D%3D.
      return "https://www.youtube.com/results?search_query=" +
             encodeURIComponent(query) +
             "&sp=EgIQAg%3D%3D";
    }

    function generateButtons() {
      results.innerHTML = "";

      const queries = input.value
        .split(/\r?\n/)
        .map(q => q.trim())
        .filter(Boolean);

      count.textContent = queries.length
        ? `${queries.length} search${queries.length === 1 ? "" : "es"} generated`
        : "";

      queries.forEach(query => {
        const row = document.createElement("div");
        row.className = "search-row";

        const text = document.createElement("div");
        text.className = "search-text";
        text.textContent = query;

        const button = document.createElement("button");
        button.className = "search-button";
        button.textContent = "Search Channels";
        button.addEventListener("click", () => {
          window.open(createYouTubeChannelSearch(query), "_blank");
          button.style.background = "#999";
          button.style.cursor = "default";
          button.disabled = true;
          button.textContent = "Searched";
        });

        row.appendChild(text);
        row.appendChild(button);
        results.appendChild(row);
      });
    }

    document.getElementById("generateBtn").addEventListener("click", generateButtons);

    document.getElementById("clearBtn").addEventListener("click", () => {
      input.value = "";
      results.innerHTML = "";
      count.textContent = "";
    });

    // Generate automatically when the user presses Ctrl+Enter.
    input.addEventListener("keydown", event => {
      if (event.ctrlKey && event.key === "Enter") {
        generateButtons();
      }
    });
  </script>
</body>
</html>
