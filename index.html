function Icon({ name, className = "w-5 h-5", strokeWidth = 1.8 }) {
  const paths = ICON_PATHS[name];
  if (!paths) return null;
  return (
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      strokeWidth={strokeWidth}
      strokeLinecap="round"
      strokeLinejoin="round"
      className={className}
      aria-hidden="true"
    >
      {paths}
    </svg>
  );
}

/* ============================================================
   CATEGORY TINTS — each category gets its own color, not one
   shared indigo tint stretched across everything. Each includes
   a dark-mode variant (muted background, lighter text).
   ============================================================ */

const CATEGORY_STYLES = {
  Images: {
    icon: "bg-amber-100 text-amber-600 dark:bg-amber-500/15 dark:text-amber-300",
    pill: "bg-amber-100 text-amber-700 dark:bg-amber-500/15 dark:text-amber-300",
    pillActive: "bg-amber-500 text-white",
    shadow: "hover:shadow-[0_16px_36px_-16px_rgba(217,119,6,0.45)]",
    ring: "hover:border-amber-300 dark:hover:border-amber-500/50",
  },
  PDF: {
    icon: "bg-rose-100 text-rose-600 dark:bg-rose-500/15 dark:text-rose-300",
    pill: "bg-rose-100 text-rose-700 dark:bg-rose-500/15 dark:text-rose-300",
    pillActive: "bg-rose-500 text-white",
    shadow: "hover:shadow-[0_16px_36px_-16px_rgba(225,29,72,0.45)]",
    ring: "hover:border-rose-300 dark:hover:border-rose-500/50",
  },
  "Dev Tools": {

    pillActive: "bg-violet-600 text-white",
    shadow: "hover:shadow-[0_16px_36px_-16px_rgba(124,58,237,0.45)]",
    ring: "hover:border-violet-300 dark:hover:border-violet-500/50",

  Text: {

    pill: "bg-teal-100 text-teal-700 dark:bg-teal-500/15 dark:text-teal-300",
    pillActive: "bg-teal-500 text-white",
    shadow: "hover:shadow-[0_16px_36px_-16px_rgba(13,148,136,0.45)]",
    ring: "hover:border-teal-300 dark:hover:border-teal-500/50",
  },
};
const DEFAULT_CATEGORY_STYLE = {
  icon: "bg-slate-100 text-slate-500 dark:bg-white/10 dark:text-slate-300",
  pill: "bg-slate-100 text-slate-600 dark:bg-white/10 dark:text-slate-300",
  pillActive: "bg-violet-600 text-white",
  shadow: "hover:shadow-[0_16px_36px_-16px_rgba(30,27,51,0.35)]",
  ring: "hover:border-slate-300 dark:hover:border-white/20",
};
function getCategoryStyle(cat) {
  return CATEGORY_STYLES[cat] || DEFAULT_CATEGORY_STYLE;
}

/* ============================================================
   COMPONENTS
   ============================================================ */

function ThemeToggle({ theme, onToggle }) {
  const isDark = theme === "dark";
  return (
    <button
      onClick={onToggle}
      aria-label={isDark ? "Switch to light mode" : "Switch to dark mode"}
      className="inline-flex items-center justify-center rounded-full border border-slate-200 bg-white p-2.5 text-slate-500 transition-colors duration-200 hover:border-violet-300 hover:text-violet-700 dark:border-white/10 dark:bg-white/5 dark:text-slate-300 dark:hover:border-violet-500/50 dark:hover:text-violet-300 focus:outline-none focus-visible:ring-2 focus-visible:ring-violet-400/50"
    >
      <Icon name={isDark ? "Sun" : "Moon"} className="w-4 h-4" strokeWidth={1.8} />
    </button>
  );
}

function Header({ toolCount, theme, onToggleTheme }) {
  return (
    <header className="sticky top-0 z-40 border-b border-violet-100 bg-white/80 backdrop-blur-md dark:border-white/10 dark:bg-[#0b0714]/80">
      <div className="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
        <div className="flex items-center gap-3">
          <div className="w-9 h-9 rounded-xl bg-gradient-to-br from-violet-600 to-fuchsia-500 flex items-center justify-center shadow-md shadow-violet-300/60 dark:shadow-violet-900/60">
            <Icon name="Wrench" className="w-4 h-4 text-white" strokeWidth={2} />
          </div>
          <div className="flex items-center gap-2">
            <span className="font-display font-extrabold brand-text text-lg tracking-tight">Tools Hub</span>
            <span className="hidden sm:inline-flex items-center rounded-full bg-violet-50 px-2 py-0.5 text-xs font-medium text-violet-700 dark:bg-violet-500/15 dark:text-violet-300">
              {toolCount} tools
            </span>
          </div>
        </div>

        <div className="flex items-center gap-2">
          {/* Replace with your own repo URL */}
          <a
            href="https://github.com/elfilaliamin/web-tools-hub"
            target="_blank"
            rel="noopener noreferrer"

            <span className="hidden sm:inline">Source</span>
          </a>
          <ThemeToggle theme={theme} onToggle={onToggleTheme} />
        </div>
      </div>
    </header>
  );
}

// A small scattered "dock" of the tools' own icons — stands in for
// the usual blurred gradient-blob decoration, but is actually made
// of this page's content instead of abstract shapes.
function IconDock() {
  const chips = [
    { icon: "FileImage", cls: "bg-amber-100 text-amber-600 dark:bg-amber-500/15 dark:text-amber-300", rotate: "-rotate-6", top: "top-2 left-6" },
    { icon: "FileText", cls: "bg-rose-100 text-rose-600 dark:bg-rose-500/15 dark:text-rose-300", rotate: "rotate-3", top: "top-16 left-28" },
    { icon: "Code2", cls: "bg-violet-100 text-violet-600 dark:bg-violet-500/15 dark:text-violet-300", rotate: "rotate-6", top: "top-0 left-44" },
    { icon: "Type", cls: "bg-teal-100 text-teal-600 dark:bg-teal-500/15 dark:text-teal-300", rotate: "-rotate-3", top: "top-24 left-2" },
  ];
  return (
    <div className="relative hidden lg:block w-56 h-40" aria-hidden="true">
      {chips.map((c, i) => (
        <div
          key={i}
          className={`absolute ${c.top} ${c.rotate} w-16 h-16 rounded-2xl ${c.cls} flex items-center justify-center shadow-lg shadow-violet-200/60 dark:shadow-black/40 border border-white dark:border-white/10`}
        >
          <Icon name={c.icon} className="w-6 h-6" strokeWidth={1.8} />
        </div>
      ))}
    </div>
  );
}

function Hero({ query, setQuery, searchRef }) {
  return (
    <section className="max-w-6xl mx-auto px-6 pt-14 pb-10">
      <div className="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-8">
        <div className="max-w-xl" style={{ animation: "fadeUp 0.5s ease-out both" }}>
          <h1 className="font-display text-4xl sm:text-5xl font-extrabold text-ink dark:text-white tracking-tight">
            Your toolbox, in one place.
          </h1>
          <p className="mt-4 text-slate-500 dark:text-slate-400 text-base sm:text-lg">
            A growing collection of small, focused tools that live right in your browser.
          </p>

          <div className="mt-8 relative max-w-md">
            <Icon
              name="Search"
              className="pointer-events-none absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400 dark:text-slate-500"
              strokeWidth={1.8}
            />
            <input
              ref={searchRef}
              type="text"
              value={query}
              onChange={(e) => setQuery(e.target.value)}
              placeholder="Search tools by name or description..."
              className="w-full rounded-2xl border border-slate-200 bg-white py-3.5 pl-11 pr-16 text-sm text-ink shadow-sm outline-none transition-all duration-200 placeholder:text-slate-400 focus:border-violet-400 focus:ring-2 focus:ring-violet-200 dark:border-white/10 dark:bg-white/5 dark:text-slate-100 dark:placeholder:text-slate-500 dark:focus:border-violet-500 dark:focus:ring-violet-500/20"
            />
            {query ? (
              <button
                onClick={() => setQuery("")}
                aria-label="Clear search"
                className="absolute right-3.5 top-1/2 -translate-y-1/2 rounded-md p-1 text-slate-400 transition-colors duration-200 hover:bg-violet-50 hover:text-violet-700 dark:text-slate-500 dark:hover:bg-violet-500/15 dark:hover:text-violet-300"
              >
                <Icon name="X" className="w-4 h-4" strokeWidth={2} />
              </button>
            ) : (
              <kbd className="absolute right-3.5 top-1/2 hidden -translate-y-1/2 items-center rounded-md border border-slate-200 bg-slate-50 px-1.5 py-0.5 font-mono text-xs text-slate-400 sm:inline-flex dark:border-white/10 dark:bg-white/5 dark:text-slate-500">
                /
              </kbd>
            )}
          </div>
        </div>

        <IconDock />
      </div>
    </section>
  );
}

function CategoryFilter({ categories, active, setActive }) {
  return (
    <div className="flex gap-2 overflow-x-auto pb-1 [-ms-overflow-style:none] [scrollbar-width:none] sm:flex-wrap sm:overflow-visible [&::-webkit-scrollbar]:hidden">
      {categories.map((cat) => {
        const isActive = active === cat;
        const style = cat === "All" ? DEFAULT_CATEGORY_STYLE : getCategoryStyle(cat);
        return (
          <button
            key={cat}
            onClick={() => setActive(cat)}
            className={
              "whitespace-nowrap rounded-full px-4 py-1.5 text-sm font-medium transition-colors duration-200 focus:outline-none focus-visible:ring-2 focus-visible:ring-violet-400/50 " +
              (isActive
                ? style.pillActive
                : "bg-white text-slate-500 border border-slate-200 hover:border-violet-300 hover:text-violet-700 dark:bg-white/5 dark:text-slate-400 dark:border-white/10 dark:hover:border-violet-500/50 dark:hover:text-violet-300")
            }
          >
            {cat}
          </button>
        );
      })}
    </div>
  );
}

function ToolCard({ tool }) {
  const style = getCategoryStyle(tool.category);
  return (
    <div
      className={
        "group flex flex-col rounded-2xl border border-slate-200 bg-white p-6 transition-all duration-200 hover:-translate-y-0.5 dark:border-white/10 dark:bg-white/5 " +
        style.ring + " " + style.shadow
      }
    >
      <div className="flex items-start justify-between">
        <div className={"flex h-11 w-11 items-center justify-center rounded-full " + style.icon}>
          <Icon name={tool.icon} className="w-5 h-5" strokeWidth={1.8} />
        </div>
        <span className={"rounded-full px-2.5 py-1 text-xs font-medium " + style.pill}>
          {tool.category}
        </span>
      </div>

      <h3 className="mt-4 font-display text-base font-bold text-ink dark:text-white">{tool.name}</h3>
      <p className="mt-1.5 flex-1 text-sm text-slate-500 dark:text-slate-400 line-clamp-2">{tool.desc}</p>

      <a
        href={tool.path}
        className="mt-6 inline-flex items-center justify-center gap-2 rounded-full bg-ink py-2.5 text-sm font-medium text-white transition-colors duration-200 group-hover:bg-violet-700 dark:bg-violet-600 dark:group-hover:bg-violet-500 focus:outline-none focus-visible:ring-2 focus-visible:ring-violet-400/50"
      >
        Open Tool
        <Icon name="ExternalLink" className="w-3.5 h-3.5" strokeWidth={2} />
      </a>
    </div>
  );
}

function ToolGrid({ tools }) {
  return (
    <div className="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3">
      {tools.map((tool) => (
        <ToolCard key={tool.id} tool={tool} />
      ))}
    </div>
  );
}

function EmptyState({ hasTools, onClear }) {
  return (
    <div className="flex flex-col items-center justify-center rounded-2xl border border-dashed border-slate-200 bg-white/60 py-20 text-center dark:border-white/10 dark:bg-white/5">
      <div className="flex h-12 w-12 items-center justify-center rounded-full bg-violet-50 dark:bg-violet-500/15">
        <Icon name="SearchX" className="w-5 h-5 text-violet-500 dark:text-violet-300" strokeWidth={1.8} />
      </div>
      {hasTools ? (
        <>
          <h3 className="mt-4 font-display font-bold text-ink dark:text-white">No tools found</h3>
          <p className="mt-1 max-w-xs text-sm text-slate-500 dark:text-slate-400">
            Try a different search term or category.
          </p>
          <button
            onClick={onClear}
            className="mt-5 rounded-full border border-slate-200 bg-white px-4 py-2 text-sm text-slate-600 transition-colors duration-200 hover:border-violet-300 hover:text-violet-700 dark:border-white/10 dark:bg-white/5 dark:text-slate-300 dark:hover:border-violet-500/50 dark:hover:text-violet-300"
          >
            Clear filters
          </button>
        </>
      ) : (
        <>
          <h3 className="mt-4 font-display font-bold text-ink dark:text-white">No tools yet</h3>
          <p className="mt-1 max-w-xs text-sm text-slate-500 dark:text-slate-400">
            Add your first tool to the TOOLS_DATA array in index.html.
          </p>
        </>
      )}
    </div>
  );
}

function Footer() {
  return (
    <footer className="border-t border-violet-100 py-8 dark:border-white/10">
      <p className="text-center text-xs text-slate-400 dark:text-slate-500">
        Tools Hub — add new tools by editing TOOLS_DATA in index.html.
      </p>
    </footer>
  );
}

function App() {
  const [query, setQuery] = useState("");
  const [activeCategory, setActiveCategory] = useState("All");
  const [theme, setTheme] = useState(() => {
    if (typeof window !== "undefined" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
      return "dark";
    }
    return "light";
  });
  const searchRef = useRef(null);

  // Keep the <html> class in sync with the chosen theme so Tailwind's
  // `dark:` variants (configured with darkMode: 'class') respond to it.
  useEffect(() => {
    const root = document.documentElement;
    if (theme === "dark") {
      root.classList.add("dark");
    } else {
      root.classList.remove("dark");
    }
  }, [theme]);

  const toggleTheme = () => setTheme((t) => (t === "dark" ? "light" : "dark"));

  // Press "/" anywhere to jump into search, like GitHub's search shortcut.
  useEffect(() => {
    function handleKey(e) {
      if (e.key !== "/") return;
      const tag = document.activeElement && document.activeElement.tagName;
      if (tag === "INPUT" || tag === "TEXTAREA") return;
      e.preventDefault();
      searchRef.current && searchRef.current.focus();
    }
    window.addEventListener("keydown", handleKey);
    return () => window.removeEventListener("keydown", handleKey);
  }, []);

  const filteredTools = useMemo(() => {
    const q = query.trim().toLowerCase();
    return TOOLS_DATA.filter((tool) => {
      const matchesCategory = activeCategory === "All" || tool.category === activeCategory;
      const matchesQuery =
        !q || tool.name.toLowerCase().includes(q) || tool.desc.toLowerCase().includes(q);
      return matchesCategory && matchesQuery;
    });
  }, [query, activeCategory]);

  return (
    <div className="flex min-h-screen flex-col">
      <Header toolCount={TOOLS_DATA.length} theme={theme} onToggleTheme={toggleTheme} />
      <Hero query={query} setQuery={setQuery} searchRef={searchRef} />

      <main className="mx-auto w-full max-w-6xl flex-1 px-6 pb-24">
        <CategoryFilter categories={CATEGORIES} active={activeCategory} setActive={setActiveCategory} />

        <p className="mb-4 mt-6 text-sm text-slate-400 dark:text-slate-500">
          Showing <span className="font-medium text-slate-600 dark:text-slate-300">{filteredTools.length}</span> of{" "}
          {TOOLS_DATA.length} tools
          {activeCategory !== "All" ? ` in ${activeCategory}` : ""}
        </p>

        {filteredTools.length > 0 ? (
          <ToolGrid tools={filteredTools} />
        ) : (
          <EmptyState
            hasTools={TOOLS_DATA.length > 0}
            onClear={() => {
              setQuery("");
              setActiveCategory("All");
            }}
          />
        )}
      </main>

      <Footer />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
