<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Calculator Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #080c14;
            --surface: rgba(255,255,255,0.04);
            --surface-hover: rgba(255,255,255,0.07);
            --border: rgba(255,255,255,0.09);
            --border-accent: rgba(99,179,237,0.35);
            --text: #eef2f7;
            --text-muted: rgba(238,242,247,0.45);
            --text-dim: rgba(238,242,247,0.25);
            --accent: #63b3ed;
            --accent-glow: rgba(99,179,237,0.15);
            --green: #68d391;
            --green-glow: rgba(104,211,145,0.12);
            --amber: #f6c90e;
            --red: #fc8181;
            --radius: 14px;
            --radius-sm: 8px;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
        }

        #vanta-bg {
            position: fixed; inset: 0; z-index: 0;
        }

        .page {
            position: relative; z-index: 1;
            min-height: 100vh;
            display: flex; align-items: flex-start; justify-content: center;
            padding: 40px 20px 60px;
        }

        .container {
            width: 100%; max-width: 920px;
        }

        /* Header */
        .header {
            text-align: center; margin-bottom: 36px;
        }
        .header-badge {
            display: inline-flex; align-items: center; gap: 7px;
            background: var(--accent-glow);
            border: 1px solid var(--border-accent);
            border-radius: 999px;
            padding: 5px 14px; font-size: 12px;
            color: var(--accent); margin-bottom: 14px;
            font-family: 'DM Mono', monospace; letter-spacing: 0.04em;
        }
        .dot-live {
            width: 7px; height: 7px; border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 8px var(--green);
            animation: pulse 2s ease infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        h1 {
            font-size: clamp(24px, 4vw, 38px);
            font-weight: 600; letter-spacing: -0.02em;
            color: var(--text);
        }
        h1 span { color: var(--accent); }
        .header-sub {
            font-size: 14px; color: var(--text-muted); margin-top: 6px;
        }

        /* Glass Card */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            backdrop-filter: blur(24px);
        }
        .card + .card { margin-top: 16px; }

        /* Rate status bar */
        .rate-bar {
            display: flex; align-items: center; justify-content: space-between;
            flex-wrap: wrap; gap: 10px; margin-bottom: 20px;
        }
        .status-pill {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 4px 12px; border-radius: 999px; font-size: 12px;
            font-family: 'DM Mono', monospace;
        }
        .pill-live { background: var(--green-glow); border: 1px solid rgba(104,211,145,0.3); color: var(--green); }
        .pill-loading { background: rgba(246,201,14,0.08); border: 1px solid rgba(246,201,14,0.3); color: var(--amber); }
        .pill-error { background: rgba(252,129,129,0.08); border: 1px solid rgba(252,129,129,0.3); color: var(--red); }
        .rate-time { font-size: 12px; color: var(--text-dim); font-family: 'DM Mono', monospace; }

        /* Two-column grid */
        .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        @media (max-width: 640px) { .two-col { grid-template-columns: 1fr; } }

        /* Labels & inputs */
        .field-label {
            display: block; font-size: 12px; font-weight: 500;
            color: var(--text-muted); text-transform: uppercase;
            letter-spacing: 0.07em; margin-bottom: 8px;
        }
        textarea, input[type="number"], select {
            width: 100%;
            background: rgba(0,0,0,0.25);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text);
            font-family: 'DM Mono', monospace;
            font-size: 13px;
            padding: 10px 12px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            appearance: none;
        }
        textarea:focus, input[type="number"]:focus, select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        textarea { resize: vertical; line-height: 1.7; }
        select option { background: #111827; }

        /* Rate grid */
        .rate-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .rate-row { display: flex; flex-direction: column; gap: 4px; }
        .rate-row label { font-size: 11px; color: var(--text-dim); font-family: 'DM Mono', monospace; }

        /* Divider */
        .divider { border: none; border-top: 1px solid var(--border); margin: 18px 0; }

        /* Button */
        .btn-calc {
            width: 100%; padding: 15px;
            background: linear-gradient(135deg, #2b6cb0 0%, #3182ce 60%, #63b3ed 100%);
            border: none; border-radius: var(--radius);
            color: #fff; font-family: 'DM Sans', sans-serif;
            font-size: 16px; font-weight: 600;
            cursor: pointer; transition: all 0.25s ease;
            letter-spacing: -0.01em;
            box-shadow: 0 4px 24px rgba(49,130,206,0.3);
        }
        .btn-calc:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(49,130,206,0.45); }
        .btn-calc:active { transform: translateY(0); }

        .btn-refresh {
            background: var(--surface); border: 1px solid var(--border);
            color: var(--text-muted); border-radius: var(--radius-sm);
            padding: 5px 12px; font-size: 12px; cursor: pointer;
            font-family: 'DM Sans', sans-serif; transition: all 0.2s;
        }
        .btn-refresh:hover { border-color: var(--accent); color: var(--accent); }

        /* Results */
        #result-section { display: none; }

        .result-header {
            font-size: 13px; color: var(--text-muted); margin-bottom: 16px;
            font-family: 'DM Mono', monospace;
        }

        .stats-row {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
            margin-bottom: 20px;
        }
        @media (max-width: 480px) { .stats-row { grid-template-columns: 1fr; } }

        .stat-box {
            background: var(--surface-hover);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 18px 16px; text-align: center;
        }
        .stat-box.profit {
            border-color: rgba(104,211,145,0.3);
            background: var(--green-glow);
        }
        .stat-val {
            font-size: 22px; font-weight: 600;
            color: var(--text); font-family: 'DM Mono', monospace;
            letter-spacing: -0.02em;
        }
        .stat-box.profit .stat-val { color: var(--green); }
        .stat-lbl { font-size: 11px; color: var(--text-muted); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.05em; }

        /* Breakdown */
        .breakdown-title { font-size: 12px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 12px; }
        .breakdown-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
        .brk-box {
            background: rgba(0,0,0,0.2); border: 1px solid var(--border);
            border-radius: var(--radius-sm); padding: 12px; text-align: center;
        }
        .brk-count { font-size: 20px; font-weight: 600; color: var(--accent); font-family: 'DM Mono', monospace; }
        .brk-cur { font-size: 11px; color: var(--text-muted); margin: 2px 0; text-transform: uppercase; letter-spacing: 0.05em; }
        .brk-amt { font-size: 12px; color: var(--text-dim); font-family: 'DM Mono', monospace; }
        .brk-usd { font-size: 11px; color: var(--text-muted); margin-top: 3px; font-family: 'DM Mono', monospace; }

        /* Fee hint */
        .fee-hint {
            font-size: 11px; color: var(--text-dim); margin-top: 6px;
            font-family: 'DM Mono', monospace;
        }
    </style>
</head>
<body>
<div id="vanta-bg"></div>

<div class="page">
  <div class="container">

    <div class="header">
      <div class="header-badge">
        <span class="dot-live"></span>
        Live exchange rates
      </div>
      <h1>Sales <span>Calculator</span> Pro</h1>
      <p class="header-sub">Multi-currency revenue with real-time FX rates</p>
    </div>

    <!-- Rate status bar -->
    <div class="rate-bar">
      <span id="rate-status" class="status-pill pill-loading">⏳ Fetching rates…</span>
      <div style="display:flex; align-items:center; gap:10px;">
        <span class="rate-time" id="rate-time"></span>
        <button class="btn-refresh" onclick="fetchRates()">↻ Refresh rates</button>
      </div>
    </div>

    <!-- Main inputs -->
    <div class="card">
      <div class="two-col">
        <!-- Left: sales data -->
        <div>
          <label class="field-label">Sales data</label>
          <textarea id="sales-list" rows="10"
            placeholder="Paste sales lines here…&#10;&#10;Order #101 (US$45.00)&#10;Order #102 (CA$60.00)&#10;Order #103 (€30.00)&#10;Order #104 (AU$55.00)&#10;Order #105 (£25.00)"></textarea>
          <div style="font-size:11px; color:var(--text-dim); margin-top:6px; font-family:'DM Mono',monospace;">
            Supports: (US$…) (CA$…) (AU$…) (€…) (£…)
          </div>
        </div>

        <!-- Right: rates + fee -->
        <div style="display:flex; flex-direction:column; gap:0;">
          <label class="field-label">Exchange rates → USD</label>
          <div class="rate-grid">
            <div class="rate-row">
              <label>CAD → USD</label>
              <input type="number" id="cad-rate" step="0.0001" oninput="saveRates()">
            </div>
            <div class="rate-row">
              <label>AUD → USD</label>
              <input type="number" id="aud-rate" step="0.0001" oninput="saveRates()">
            </div>
            <div class="rate-row">
              <label>GBP → USD</label>
              <input type="number" id="gbp-rate" step="0.0001" oninput="saveRates()">
            </div>
            <div class="rate-row">
              <label>EUR → USD</label>
              <input type="number" id="eur-rate" step="0.0001" oninput="saveRates()">
            </div>
          </div>

          <hr class="divider">

          <label class="field-label">Platform fee</label>
          <select id="fee-percentage" onchange="saveFee()">
            <option value="0">0% — No fee</option>
            <option value="20">20%</option>
            <option value="50">50%</option>
            <option value="75" selected>75%</option>
          </select>

          <div style="margin-top:12px;">
            <label class="field-label">Custom fee %</label>
            <input type="number" id="custom-fee" min="0" max="100" step="0.1" placeholder="e.g. 30.5" oninput="applyCustomFee()">
            <div class="fee-hint" id="fee-hint">Active fee: 75%</div>
          </div>
        </div>
      </div>

      <div style="margin-top:20px;">
        <button class="btn-calc" onclick="calculate()">Calculate Revenue</button>
      </div>
    </div>

    <!-- Results -->
    <div id="result-section">
      <div class="card" style="margin-top:16px;">
        <div class="result-header" id="result-meta"></div>
        <div class="stats-row" id="stats-row"></div>
        <hr class="divider">
        <div class="breakdown-title">Currency breakdown</div>
        <div class="breakdown-grid" id="breakdown"></div>
      </div>
    </div>

  </div>
</div>

<script>
VANTA.NET({
  el: "#vanta-bg",
  mouseControls: true,
  touchControls: true,
  color: 0x3182ce,
  backgroundColor: 0x080c14,
  points: 10,
  maxDistance: 22,
  spacing: 18,
  backgroundAlpha: 1
});

const app = { rates: { US: 1, CA: 0.73, AU: 0.65, GBP: 1.33, EUR: 1.16 }, fee: 75 };

async function fetchRates() {
  const statusEl = document.getElementById('rate-status');
  const timeEl = document.getElementById('rate-time');
  statusEl.className = 'status-pill pill-loading';
  statusEl.textContent = '⏳ Fetching rates…';
  try {
    const r = await fetch('https://api.exchangerate-api.com/v4/latest/USD');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    app.rates.CA = +(1 / d.rates.CAD).toFixed(5);
    app.rates.AU = +(1 / d.rates.AUD).toFixed(5);
    app.rates.GBP = +(1 / d.rates.GBP).toFixed(5);
    app.rates.EUR = +(1 / d.rates.EUR).toFixed(5);
    document.getElementById('cad-rate').value = app.rates.CA;
    document.getElementById('aud-rate').value = app.rates.AU;
    document.getElementById('gbp-rate').value = app.rates.GBP;
    document.getElementById('eur-rate').value = app.rates.EUR;
    statusEl.className = 'status-pill pill-live';
    statusEl.textContent = '✓ Live rates active';
    const now = new Date();
    timeEl.textContent = 'Updated ' + now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  } catch (e) {
    statusEl.className = 'status-pill pill-error';
    statusEl.textContent = '✕ Offline — using defaults';
    document.getElementById('cad-rate').value = 0.73;
    document.getElementById('aud-rate').value = 0.65;
    document.getElementById('gbp-rate').value = 1.33;
    document.getElementById('eur-rate').value = 1.16;
  }
}

function saveRates() {
  app.rates.CA = parseFloat(document.getElementById('cad-rate').value) || 0.73;
  app.rates.AU = parseFloat(document.getElementById('aud-rate').value) || 0.65;
  app.rates.GBP = parseFloat(document.getElementById('gbp-rate').value) || 1.33;
  app.rates.EUR = parseFloat(document.getElementById('eur-rate').value) || 1.16;
}

function saveFee() {
  app.fee = parseFloat(document.getElementById('fee-percentage').value) || 0;
  document.getElementById('custom-fee').value = '';
  document.getElementById('fee-hint').textContent = 'Active fee: ' + app.fee + '%';
}

function applyCustomFee() {
  const v = parseFloat(document.getElementById('custom-fee').value);
  if (!isNaN(v) && v >= 0 && v <= 100) {
    app.fee = v;
    document.getElementById('fee-percentage').value = '';
    document.getElementById('fee-hint').textContent = 'Active fee: ' + v + '%';
  }
}

function parseAmounts(text) {
  const patterns = [
    { re: /\(US\$([\d.,]+)\)/gi, code: 'US' },
    { re: /\(CA\$([\d.,]+)\)/gi, code: 'CA' },
    { re: /\(AU\$([\d.,]+)\)/gi, code: 'AU' },
    { re: /\(€([\d.,]+)\)/gi, code: 'EUR' },
    { re: /\(£([\d.,]+)\)/gi, code: 'GBP' },
  ];
  const out = [];
  patterns.forEach(({ re, code }) => {
    let m;
    while ((m = re.exec(text)) !== null)
      out.push({ currency: code, amount: parseFloat(m[1].replace(/,/g, '')) });
  });
  return out;
}

const fmt = v => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 2 }).format(v);

function calculate() {
  const text = document.getElementById('sales-list').value.trim();
  if (!text) { alert('Paste some sales data first.'); return; }
  saveRates(); saveFee();
  const sales = parseAmounts(text);
  if (!sales.length) {
    alert('No amounts found.\nUse formats like: (US$45.00), (CA$60.00), (€30.00), (AU$55.00), (£25.00)');
    return;
  }

  let total = 0;
  const bk = {};
  sales.forEach(s => {
    const rate = app.rates[s.currency];
    if (!rate) return;
    const usd = s.amount * rate;
    total += usd;
    if (!bk[s.currency]) bk[s.currency] = { count: 0, sum: 0, usd: 0 };
    bk[s.currency].count++;
    bk[s.currency].sum += s.amount;
    bk[s.currency].usd += usd;
  });

  const fee = total * (app.fee / 100);
  const net = total - fee;

  document.getElementById('result-meta').textContent =
    sales.length + ' sale' + (sales.length !== 1 ? 's' : '') + ' · ' + app.fee + '% platform fee · ' + Object.keys(bk).length + ' currencies';

  document.getElementById('stats-row').innerHTML = `
    <div class="stat-box">
      <div class="stat-val">${fmt(total)}</div>
      <div class="stat-lbl">Gross Revenue</div>
    </div>
    <div class="stat-box">
      <div class="stat-val">${fmt(fee)}</div>
      <div class="stat-lbl">Platform Fee (${app.fee}%)</div>
    </div>
    <div class="stat-box profit">
      <div class="stat-val">${fmt(net)}</div>
      <div class="stat-lbl">Net Profit</div>
    </div>
  `;

  const symMap = { US: '$', CA: 'CA$', AU: 'AU$', EUR: '€', GBP: '£' };
  document.getElementById('breakdown').innerHTML = Object.entries(bk).map(([cur, d]) =>
    `<div class="brk-box">
      <div class="brk-count">${d.count}</div>
      <div class="brk-cur">${cur} sales</div>
      <div class="brk-amt">${symMap[cur] || ''}${d.sum.toFixed(2)}</div>
      <div class="brk-usd">${fmt(d.usd)} USD</div>
    </div>`
  ).join('');

  const el = document.getElementById('result-section');
  el.style.display = 'block';
  el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

fetchRates();
</script>
</body>
</html>
